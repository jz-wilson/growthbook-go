version: "2"
linters:
  default: standard
  enable:
    - gocyclo
    - goconst
    - misspell
    - unconvert
    - unparam
  settings:
    gocyclo:
      min-complexity: 10
    goconst:
      min-occurrences: 5
  exclusions:
    rules:
      - path: _test\.go
        linters: [gocyclo, unparam]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jz-wilson/growthbook-go
