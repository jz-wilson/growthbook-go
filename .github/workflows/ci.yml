name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and test
        run: |
          go vet ./...
          go test -race -cover ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  integration:
    runs-on: ubuntu-24.04
    env:
      GROWTHBOOK_API_URL: http://localhost:3100/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start GrowthBook
        run: docker compose -f e2e/docker-compose.yml up -d --wait
      - name: Mint API key
        run: |
          KEY=$(e2e/bootstrap.sh)
          echo "::add-mask::${KEY}"
          echo "GROWTHBOOK_API_KEY=${KEY}" >> "$GITHUB_ENV"
      - name: Integration tests
        run: go test -tags integration -count=1 -v ./...
      - name: GrowthBook logs on failure
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs --no-color growthbook | tail -200
